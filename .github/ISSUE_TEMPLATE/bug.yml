name: Bug
description: Something reMarkable Agent MCP got wrong (a mark misread, a tool error, a crash)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For ink, describe what you drew and what came back (the tool output helps a lot).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Tool call(s) and arguments. Please don't attach private documents; a photo or a redrawn sketch is enough.
  - type: input
    id: version
    attributes:
      label: reMarkable Agent MCP version / tablet
      placeholder: "remarkable-agent-mcp 1.3.0, reMarkable 2 (3.28)"
